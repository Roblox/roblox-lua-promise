name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, generic-linux]
    container: docker.artifactory.rbx.com/rbx-lua-build-tools:v2.0.0

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Generate access token
        uses: Roblox-ActionsCache/tibdex-github-app-token@v1.4.0
        id: setup_token
        with:
          app_id: ${{ secrets.TOKENS_APP_LUA_ECOSYSTEM_DEPENDENCIES_ID }}
          private_key: ${{ secrets.TOKENS_APP_LUA_ECOSYSTEM_DEPENDENCIES_KEY }}

      - name: Get foreman and run foreman install
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ steps.setup_token.outputs.token }}
          allow-external-github-orgs: true

      - name: Publish package
        env:
          REGISTRY_DOMAIN: ${{ vars.REGISTRY_DOMAIN }}
          REGISTRY_TOKEN: ${{ secrets.ROBLOX_ARTIFACTORY_CI_PUBLISH_BEARER_TOKEN }}
        run: |
          lute pkg auth --domain "$REGISTRY_DOMAIN" --token "$REGISTRY_TOKEN"
          lute pkg publish
